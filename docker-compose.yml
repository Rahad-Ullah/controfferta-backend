services:
  # --- Development Service ---
  server-dev:
    profiles: ['dev']
    build:
      context: .
      target: dev
    env_file:
      - .env
    ports:
      - '${PORT_DEV}:${PORT_DEV}'
    volumes:
      - ./winston:/app/winston

    develop:
      watch:
        - action: rebuild
          path: ./package.json

        - action: rebuild
          path: ./package-lock.json

        - action: sync
          path: ./src
          target: /app/src

        - action: sync+restart
          path: ./tsconfig.json
          target: /app/tsconfig.json

        - action: sync+restart
          path: ./.env
          target: /app/.env

  # --- Production Service ---
  server-prod:
    profiles: ['prod']
    build:
      context: .
      target: prod
    env_file:
      - .env
    ports:
      - '${PORT}:${PORT}'
    volumes:
      - ./winston:/app/winston

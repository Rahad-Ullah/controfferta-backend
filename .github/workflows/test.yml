name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      BCRYPT_SALT_ROUNDS: 10
      JWT_SECRET: test_jwt_secret
      JWT_EXPIRE_IN: 1d
      JWT_REFRESH_SECRET: test_jwt_refresh_secret
      JWT_REFRESH_EXPIRE_IN: 7d
      CRYPTO_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      STRIPE_SECRET_KEY: sk_test_mock
      STRIPE_API_VERSION: 2024-06-20
      STRIPE_WEBHOOK_SECRET: whsec_test_mock
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test_mock_aws_access_key
      AWS_SECRET_ACCESS_KEY: test_mock_aws_secret_key
      S3_BUCKET_NAME: test-bucket
      ELASTICSEARCH_NODE: http://127.0.0.1:9200

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage/
          retention-days: 14
